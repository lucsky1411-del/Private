name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: combatdata-mod
          path: build/libs/*.jar
      - name: Publish download (release "latest")
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Combat Data for Minecraft 1.21.11 (latest build)
          body: Put the combatdata jar into your .minecraft/mods folder. Needs Fabric Loader and Fabric API for 1.21.11.
          prerelease: false
          make_latest: true
          files: build/libs/*.jar
