name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Report errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = open('build.log', errors='replace').read().splitlines()
          keep = [l for l in lines if re.search(r'error:|warning: \[|What went wrong|FAILED|Exception|Could not|> |symbol:|location:|^\s+\^', l)]
          if not keep: keep = lines[-120:]
          text = '\n'.join(keep)[:60000]
          chunks = [text[i:i+3500] for i in range(0, len(text), 3500)][:10]
          for i, c in enumerate(chunks):
              enc = c.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=build log part {i+1}::{enc}')
          PY
      - name: Check mixin targets against the game
        continue-on-error: true
        run: |
          set +e
          cands=$(find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -iv sources)
          JAR=$(echo "$cands" | grep -iE 'merged|client' | grep -iE 'named|mojang|official' | head -1)
          [ -z "$JAR" ] && JAR=$(echo "$cands" | grep -iE 'merged|client' | head -1)
          out=""
          for c in net.minecraft.client.MouseHandler net.minecraft.client.Minecraft net.minecraft.client.multiplayer.MultiPlayerGameMode net.minecraft.client.multiplayer.ClientPacketListener net.minecraft.world.entity.LivingEntity; do
            out="$out$c: $(javap -p -cp "$JAR" $c 2>&1 | grep -E '(onButton|startAttack|attack|handleAnimate|jumpFromGround|handleDamageEvent)\(|Error' | tr '\n' ' ')%0A"
          done
          list=$(echo "$cands" | head -15 | tr '\n' ' ')
          echo "::warning title=mixin targets::jar=$JAR%0A${out}%0Acandidates: $list"
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: combatdata-mod
          path: build/libs/*.jar
      - name: Publish download (release "latest")
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Combat Data for Minecraft 1.21.11 (latest build)
          body: Put the combatdata jar into your .minecraft/mods folder. Needs Fabric Loader and Fabric API for 1.21.11.
          prerelease: false
          make_latest: true
          files: build/libs/*.jar
